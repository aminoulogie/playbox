name: Playbox
options:
  bundleIdPrefix: com.playboxapp
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  VLCKit:
    url: https://github.com/videolan/vlckit.git
    revision: 2e0868f5ed40fe59cd92f377645fdcc260c6e759
targets:
  Playbox:
    type: application
    platform: iOS
    sources:
      - path: Playbox
    dependencies:
      - framework: vendor/LibtorrentNative.framework
        embed: true
      - framework: vendor/openssl.framework
        embed: true
      - package: VLCKit
        product: VLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playboxapp.playbox
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        SWIFT_COMPILATION_MODE: wholemodule
        DEAD_CODE_STRIPPING: YES
