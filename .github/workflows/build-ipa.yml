name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Playbox/**'
      - 'native/**'
      - 'vendor/**'
      - 'ThirdParty/**'
      - 'project.yml'
      - 'scripts/build_libtorrent_ios.sh'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install build dependencies
        run: brew install xcodegen cmake boost

      - name: Build libtorrent backend for iOS 17
        env:
          IOS_DEPLOYMENT_TARGET: "17.0"
          LIBTORRENT_REF: "v2.0.13"
        run: bash scripts/build_libtorrent_ios.sh

      - name: Verify native frameworks
        run: |
          set -euo pipefail
          test -f vendor/LibtorrentNative.framework/LibtorrentNative
          test -f vendor/openssl.framework/openssl
          otool -L vendor/LibtorrentNative.framework/LibtorrentNative

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Stamp app version
        run: |
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" Playbox.xcodeproj/project.pbxproj 2>/dev/null || true

      - name: Build for physical iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Playbox.xcodeproj \
            -scheme Playbox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            INFOPLIST_KEY_CFBundleShortVersionString="1.0.${{ github.run_number }}" \
            INFOPLIST_KEY_CFBundleVersion="${{ github.run_number }}" \
            build

      - name: Verify embedded torrent frameworks
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Playbox.app"
          test -f "$APP/Frameworks/LibtorrentNative.framework/LibtorrentNative"
          test -f "$APP/Frameworks/openssl.framework/openssl"
          otool -L "$APP/Frameworks/LibtorrentNative.framework/LibtorrentNative"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Playbox.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP" "$RUNNER_TEMP/package/Payload/"
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          (cd "$RUNNER_TEMP/package" && zip -qry "$GITHUB_WORKSPACE/Playbox-v${VERSION}.ipa" Payload)
          cp "$GITHUB_WORKSPACE/Playbox-v${VERSION}.ipa" "$GITHUB_WORKSPACE/Playbox-latest.ipa"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          ls -lh Playbox-v1.0.${GITHUB_RUN_NUMBER}.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Playbox-unsigned-IPA
          path: Playbox-v1.0.${{ github.run_number }}.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Playbox v1.0.${{ github.run_number }}
          body: |
            Automated Playbox iOS build from commit ${{ github.sha }}.
            Torrent backend: libtorrent 2.0.13.
            This IPA is unsigned and requires valid Apple signing before normal iPhone installation.
          files: Playbox-v1.0.${{ github.run_number }}.ipa
          fail_on_unmatched_files: true

      - name: Update stable latest release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$(gh release list --limit 100 | awk '/Latest/{print $3; exit}')" --cleanup-tag -y 2>/dev/null || true
          gh release create "v1.0.${GITHUB_RUN_NUMBER}-latest" Playbox-latest.ipa \
            --title "Playbox v1.0.${GITHUB_RUN_NUMBER} — Latest" \
            --notes "Version 1.0.${GITHUB_RUN_NUMBER}. libtorrent 2.0.13 backend. Commit: ${GITHUB_SHA}."
