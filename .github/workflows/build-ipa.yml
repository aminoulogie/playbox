name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Playbox/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Stamp app version
        run: |
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" Playbox.xcodeproj/project.pbxproj 2>/dev/null || true

      - name: Build for physical iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Playbox.xcodeproj \
            -scheme Playbox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            INFOPLIST_KEY_CFBundleShortVersionString=1.0 \
            INFOPLIST_KEY_CFBundleVersion="${{ github.run_number }}" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Playbox.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP" "$RUNNER_TEMP/package/Payload/"
          (cd "$RUNNER_TEMP/package" && zip -qry "$GITHUB_WORKSPACE/Playbox-build-${GITHUB_RUN_NUMBER}.ipa" Payload)
          cp "$GITHUB_WORKSPACE/Playbox-build-${GITHUB_RUN_NUMBER}.ipa" "$GITHUB_WORKSPACE/Playbox-latest.ipa"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          ls -lh Playbox-build-${GITHUB_RUN_NUMBER}.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Playbox-unsigned-IPA
          path: Playbox-build-${{ github.run_number }}.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Playbox Build ${{ github.run_number }}
          body: |
            Automated Playbox iOS build from commit ${{ github.sha }}.
            This IPA is unsigned and requires valid Apple signing before normal iPhone installation.
          files: Playbox-build-${{ github.run_number }}.ipa
          fail_on_unmatched_files: true


      - name: Update stable latest release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest Playbox-latest.ipa \
            --title "Playbox Latest — Build ${GITHUB_RUN_NUMBER}" \
            --notes "Always-current Playbox IPA. Internal app build: ${GITHUB_RUN_NUMBER}. Commit: ${GITHUB_SHA}."
