name: Torrent Diagnostics Build

on:
  push:
    branches:
      - fix/torrent-discovery-diagnostics
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project Playbox.xcodeproj \
            -scheme Playbox \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"

      - name: Patch SwiftTorrent
        run: |
          set -euo pipefail
          python3 scripts/patch_swifttorrent.py \
            "$RUNNER_TEMP/DerivedData/SourcePackages/checkouts/swift-torrent"

      - name: Build for physical iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Playbox.xcodeproj \
            -scheme Playbox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
