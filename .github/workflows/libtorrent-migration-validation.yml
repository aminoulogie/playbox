name: Libtorrent Migration Validation

on:
  push:
    branches:
      - feat/libtorrent-engine
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: brew install xcodegen cmake boost

      - name: Build libtorrent backend
        env:
          IOS_DEPLOYMENT_TARGET: "17.0"
          LIBTORRENT_REF: "v2.0.13"
        run: bash scripts/build_libtorrent_ios.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build Playbox for physical iPhone
        run: |
          set -o pipefail
          xcodebuild \
            -project Playbox.xcodeproj \
            -scheme Playbox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify embedded frameworks
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Playbox.app"
          test -f "$APP/Frameworks/LibtorrentNative.framework/LibtorrentNative"
          test -f "$APP/Frameworks/openssl.framework/openssl"
          otool -L "$APP/Frameworks/LibtorrentNative.framework/LibtorrentNative"
