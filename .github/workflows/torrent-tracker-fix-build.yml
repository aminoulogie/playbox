name: Torrent Tracker Fix Build

on:
  push:
    branches:
      - fix/merge-stremio-trackers
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for physical iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Playbox.xcodeproj \
            -scheme Playbox \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
