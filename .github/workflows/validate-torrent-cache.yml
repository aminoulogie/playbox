name: Validate torrent cache UI

on:
  push:
    branches: [codex/torrent-source-sorting]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install xcodegen cmake boost

      - name: Build libtorrent backend for iOS 17
        env:
          IOS_DEPLOYMENT_TARGET: "17.0"
          LIBTORRENT_REF: "v2.0.13"
        run: bash scripts/build_libtorrent_ios.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build Release for physical iPhone
        run: |
          set -o pipefail
          xcodebuild \
            -project Playbox.xcodeproj \
            -scheme Playbox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
